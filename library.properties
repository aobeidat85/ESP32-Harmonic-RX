paragraph=Captures timestamped tone energies using the private PHY dump path. Includes onboard VEVOR YT60234 decoding, a recorded-capture host decoder, and a local dashboard with metric and imperial display units. Requires Arduino-ESP32 2.0.17 and a dual-core original ESP32 at 240MHz. Native 915 MHz reception is unverified.
